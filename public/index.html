<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Battlemax</title>
<meta name="theme-color" content="#24160c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lilita+One&display=swap" rel="stylesheet">
<script src="/api/config"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<style>
:root{--disp:"Lilita One",system-ui,sans-serif;--crest:"Cinzel",Georgia,serif;--bg:#24160c;--panel:#4a2f1a;--panel2:#5c3b20;--line:#2a180a;--text:#ffffff;--mute:#e9cf96;--red:#e0523f;--blue:#3d7be0;--acc:#f2b93b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg) radial-gradient(ellipse at 50% -10%,#5a3a1c 0,transparent 65%) no-repeat;color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:720px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.grow{flex:1}
#coBar{display:flex;gap:6px}
.co{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:5px 9px;border-radius:10px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.co .top{display:flex;align-items:center;gap:6px;min-width:0}
.co.turn{border-color:#9a6a3a}
.co.pw{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.co .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co .tg{color:var(--mute);font-size:12px;white-space:nowrap}
.stars{display:flex;gap:1px;flex:none}
.st{width:9px;height:9px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#7a5230;position:relative;overflow:hidden}
.st.big{width:12px;height:12px}
.st i{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);color:#1b1b1b;border-color:transparent}
button.pow{background:linear-gradient(135deg,#f2b93b,#e8742c);color:#1b1b1b;border-color:transparent}
button.icon{padding:6px 10px;display:inline-flex;align-items:center;justify-content:center;color:#ffffff}
button.acct{display:inline-flex;align-items:center;color:#ffffff}
header button{flex:none;min-width:40px;justify-content:center}
header .chip{flex:0 1 auto;min-width:0}
#board{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);align-self:center}
canvas{display:block;touch-action:manipulation}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:96px}
#info{color:var(--mute);min-height:20px}
#info b{color:var(--text)}
#btns{display:flex;flex-wrap:wrap;gap:8px}
#btns button{flex:1 1 auto;min-width:72px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.solid{background:#2a180a}
.modal.hide{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:460px;width:100%;max-height:88vh;overflow:auto}
.card h2{margin:0 0 10px;font-size:18px}
.card h3{margin:12px 0 4px;font-size:15px}
.card p{margin:6px 0;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.grid.one{grid-template-columns:1fr}
.grid button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px}
.grid small{color:var(--mute);font-weight:500}
.grid small b{color:var(--text)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{flex:1}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(58,36,18,.96);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-weight:700;z-index:9;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;max-width:90vw}
.toast.on{opacity:1}
.toast.big{font-size:20px;border-color:var(--acc);border-radius:14px;padding:14px 22px}
.battle{position:fixed;inset:0;background:rgba(30,18,8,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20}
.battle.hide{display:none}
.battle canvas{border-radius:12px;border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.bbar{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px}
.bbar button{padding:6px 10px;font-size:13px}
.av{display:inline-flex;border-radius:50%;overflow:hidden;flex:none;border:1px solid rgba(255,255,255,.15)}
.av svg{width:100%;height:100%}
.co{flex-direction:row !important;align-items:center;gap:8px !important}
.co .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.meter{position:relative;height:8px;border-radius:99px;background:#6b4526;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#c8902e,#f2b93b);transition:width .4s}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#ffffff;opacity:.75;border-radius:1px}
.meter.ready i{background:linear-gradient(90deg,#f2b93b,#e8742c);box-shadow:0 0 8px #f2b93b;animation:pulse 1.1s ease-in-out infinite}
.meter.full i{background:linear-gradient(90deg,#e8742c,#d8402e);box-shadow:0 0 10px #ff7a3c}
@keyframes pulse{50%{filter:brightness(1.35)}}
.fx{position:fixed;inset:0;z-index:30;overflow:hidden}
.fx.hide{display:none !important}
#pwr{background:#2a180a;display:flex;align-items:center;justify-content:center}
#pwr .burst{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,var(--sc) 0deg 8deg,transparent 8deg 20deg);opacity:0}
#pwr.go .burst{animation:burst 2.6s ease-out forwards, spin 6s linear infinite}
@keyframes burst{0%{opacity:0;transform:scale(.3)}15%{opacity:.5}100%{opacity:.35;transform:scale(1)}}
@keyframes spin{to{rotate:360deg}}
#pwr .band{position:relative;width:100%;display:flex;align-items:center;gap:14px;padding:18px 18px;background:linear-gradient(90deg,var(--sd),var(--sc) 60%,var(--sd));border-top:3px solid #f2b93b;border-bottom:3px solid #f2b93b;transform:translateX(-110%);box-shadow:0 0 40px rgba(0,0,0,.6)}
#pwr .band.rev{flex-direction:row-reverse;text-align:right;transform:translateX(110%)}
#pwr.go .band{animation:bandIn .45s cubic-bezier(.2,1.4,.4,1) .1s forwards}
@keyframes bandIn{to{transform:translateX(0)}}
#pwr .pav{width:130px;height:130px;flex:none;border-radius:50%;background:radial-gradient(circle,#fff6 0,transparent 70%);transform:scale(.4)}
#pwr.go .pav{animation:pop .5s cubic-bezier(.2,1.6,.4,1) .35s forwards, shout .14s ease-in-out 1s 6}
@keyframes pop{to{transform:scale(1)}}
@keyframes shout{0%,100%{translate:0 0}50%{translate:2px -3px}}
#pwr .pav svg{width:100%;height:100%}
#pwr .ptxt{display:flex;flex-direction:column;gap:2px;min-width:0;opacity:0}
#pwr.go .ptxt{animation:txt .4s ease-out .55s forwards}
@keyframes txt{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
#pwr .ptxt small{font-weight:900;letter-spacing:.2em;color:#f2b93b;font-size:13px}
#pwr .ptxt strong{font-size:34px;line-height:1.05;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);font-style:italic}
#pwr .ptxt span{color:#fff;opacity:.85;font-size:13px}
#pwr .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#pwr.go .flash{animation:flash .5s ease-out .05s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#pwr .hint,#vic .hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#e9cf96;font-size:13px}
#vic{background:radial-gradient(circle at 50% 35%,#3a2412,#2a180a 70%);display:flex;align-items:center;justify-content:center;padding:16px}
#vic .rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,var(--sc) 0deg 6deg,transparent 6deg 18deg);opacity:.18;animation:spin 18s linear infinite}
#vic .confetti{position:absolute;inset:0;pointer-events:none}
#vic .confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{top:105%;rotate:720deg;translate:30px 0}}
#vic .vcard{position:relative;max-width:460px;width:100%;text-align:center}
#vic .vtitle{font-size:38px;font-weight:900;font-style:italic;letter-spacing:.02em;text-shadow:0 4px 0 rgba(0,0,0,.4);animation:pop2 .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop2{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
#vic .vstage{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:14px 0 4px}
#vic .vwin{width:50%;max-width:190px;animation:cheer 1.1s ease-in-out .5s infinite}
#vic .vwin svg{width:100%;filter:drop-shadow(0 0 18px rgba(242,185,59,.45))}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-3deg)}60%{transform:translateY(-4px) rotate(2deg)}}
#vic .vlose{position:relative;width:28%;max-width:110px;opacity:.9;filter:grayscale(.55) brightness(.8);transform-origin:50% 100%;animation:slump .9s ease-out .4s both, sway 3s ease-in-out 1.4s infinite}
#vic .vlose svg{width:100%}
@keyframes slump{0%{transform:rotate(0)}30%{transform:rotate(-14deg) translateX(-6px)}55%{transform:rotate(10deg)}100%{transform:rotate(8deg) translateY(6px)}}
@keyframes sway{0%,100%{transform:rotate(8deg) translateY(6px)}50%{transform:rotate(4deg) translateY(8px)}}
#vic .smoke{position:absolute;left:0;right:0;top:-6px;height:30px}
#vic .smoke b{position:absolute;bottom:0;width:18px;height:18px;border-radius:50%;background:rgba(140,140,150,.55);animation:smoke 2.2s ease-out infinite}
#vic .smoke b:nth-child(1){left:28%}#vic .smoke b:nth-child(2){left:48%;animation-delay:.7s}#vic .smoke b:nth-child(3){left:64%;animation-delay:1.4s}
@keyframes smoke{0%{transform:translateY(0) scale(.5);opacity:.8}100%{transform:translateY(-40px) scale(1.6);opacity:0}}
#vic .vname{font-weight:800;margin-top:4px}
#vic{overflow-y:auto;align-items:flex-start}
#vic .vcard{margin:auto 0}
.vrank{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(58,36,18,.92);border:1px solid #2a180a;border-radius:12px;padding:10px 12px;margin:10px 0 8px}
.vrank b{display:block}.vrank small{color:#e9cf96}
.rk{width:46px;height:46px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;font-style:italic;color:#1b1b1b;background:#9aa1ad}
.rk-S{background:linear-gradient(135deg,#ffe27a,#e8742c);box-shadow:0 0 16px #f2b93b}.rk-A{background:#f2b93b}.rk-B{background:#7fe08a}.rk-C{background:#7ab8ff}
.vstats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:0;background:rgba(58,36,18,.92);border:1px solid #2a180a;border-radius:12px;padding:6px 12px;text-align:right;font-size:13px}
.vstats span{padding:5px 0;border-bottom:1px solid #4a2f1a}
.vstats span:nth-child(3n+1){text-align:left;color:#e9cf96}
.vstats span:nth-child(-n+3){font-weight:800;border-bottom-color:#7a5230}
.vstats span:nth-last-child(-n+3){border-bottom:none}
#vic .vname small{display:block;color:#e9cf96;font-weight:600}
#vic .vsub{color:#e9cf96}
#vic.still *{animation:none !important}
#vic.still .vlose{transform:rotate(8deg) translateY(6px)}

button.acct{padding:6px 10px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
button.acct.on{border-color:#9a6a3a;color:#f2b93b}
button.acct .an{margin-left:5px}
@media (max-width:480px){button.acct .an{display:none}button.acct{padding:6px 10px}}
header{flex-wrap:nowrap}
header .chip{padding:6px 8px;font-size:13px}
.linkish{background:none;border:none;color:#f2b93b;padding:0;text-decoration:underline;font-weight:600}
.vsave{color:#e9cf96;font-size:13px;margin:8px 0 0;min-height:18px}
.form{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
.form label small{color:#e9cf96;font-weight:500}
.form label.check{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.form input,.form select,.form textarea{font:inherit;font-size:16px;color:#ffffff;background:#2e1c0e;border:1px solid #7a5230;border-radius:10px;padding:10px;-webkit-user-select:text;user-select:text}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid #f2b93b;outline-offset:1px}
.pwWrap{position:relative;display:flex}.pwWrap input{flex:1;padding-right:64px;min-width:0}
.pwEye{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:13px;font-weight:600;color:#f2b93b;background:none;border:0;padding:6px 8px;cursor:pointer;min-height:32px}
.aMsg{min-height:18px;margin:0;font-size:13px}.aMsg.bad{color:#ff8a78}.aMsg.ok{color:#7fe08a}
.tabs{display:flex;gap:6px;margin-bottom:4px}.tabs button{flex:1;padding:8px}.tabs button.on{background:#f2b93b;color:#1b1b1b;border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin:10px 0}
.kpis div{background:#2e1c0e;border:1px solid #2a180a;border-radius:10px;padding:8px;text-align:center}
.kpis b{display:block;font-size:16px}.kpis small{color:#e9cf96}
.hist,.lb{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.hrow{display:flex;align-items:center;gap:10px;background:#2e1c0e;border:1px solid #2a180a;border-radius:10px;padding:8px 10px}
.hrow .res{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.hrow.w .res{background:#2c5a34;color:#9ff0a8}.hrow.l .res{background:#5a2c2c;color:#ffb0a4}
.hrow .mid{flex:1;min-width:0;display:flex;flex-direction:column}.hrow .mid small{color:#e9cf96}
.rk.sm{width:30px;height:30px;font-size:17px;border-radius:7px}
.rk-none{background:#7a5230;color:#e9cf96}
.lhead,.lrow{display:grid;grid-template-columns:28px 1fr 52px 50px 34px;gap:6px;align-items:center;font-size:13px}
.lhead{color:#e9cf96;padding:0 10px;margin-top:6px}
.lrow{background:#2e1c0e;border:1px solid #2a180a;border-radius:10px;padding:7px 10px}
.lrow.me{border-color:#f2b93b}
.lrow .pos{font-weight:800;color:#e9cf96}.lrow .nm2{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- Battlemax fantasy ---- */
.card h2,.card h3,#vic .vtitle,#pwr .ptxt strong,#pwr .ptxt small,.chip,button,.co .nm,.kpis b,.rk{font-family:var(--disp);font-weight:400 !important;letter-spacing:.02em}
.card h2{font-family:var(--crest);font-weight:900 !important;font-size:20px;line-height:1.25;color:#ffe7a8;text-shadow:0 2px 0 #2a180a}
button{border:2px solid #2a180a !important;box-shadow:0 3px 0 #2a180a,inset 0 1px 0 #ffffff22;border-radius:10px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px),linear-gradient(180deg,#6b4526,#55361d);color:#fff4dc}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #2a180a}
button.pri{background:linear-gradient(180deg,#ffd46b,#e0a22c);color:#3a2208;box-shadow:0 3px 0 #2a180a,inset 0 1px 0 #fff6}
.card{background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px),linear-gradient(180deg,#6b4526,#55361d);border:3px solid #2a180a;border-radius:16px;box-shadow:0 0 0 2px #c8902e inset,0 6px 0 #2a180a,0 20px 50px #000a}
.chip,.co,#panel{background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px),linear-gradient(180deg,#6b4526,#55361d);border:2px solid #2a180a;box-shadow:0 0 0 1px #c8902e88 inset,0 3px 0 #2a180a}
#board{border:4px solid #2a180a;border-radius:12px;box-shadow:0 0 0 3px #8a5a2c,0 0 0 5px #2a180a,0 8px 0 #2a180a}
.meter{background:#2a180a;border:2px solid #2a180a}
.logo{display:flex;align-items:center;gap:12px;margin:2px 0 8px}
.logo svg{flex:none}
.logo .wm{font-family:var(--crest);font-weight:900;font-size:30px;line-height:1;color:#fff4dc;letter-spacing:.04em;text-shadow:0 3px 0 #2a180a,2px 0 0 #2a180a,-2px 0 0 #2a180a,0 -2px 0 #2a180a}
.logo .wm b{color:#f2b93b;font-weight:900}
.logo small{display:block;font-family:var(--crest);font-weight:700;font-size:11px;letter-spacing:.3em;color:#e9cf96;margin-top:7px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--crest);font-weight:900;letter-spacing:.06em;font-size:14px;color:#ffe7a8;padding:0 2px;text-shadow:0 2px 0 #2a180a}
@media (max-width:420px){.brand span{display:none}}
button[data-co]{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif !important}
button[data-co] .nm{font-family:var(--disp) !important}
ul{padding-left:18px;margin:6px 0;color:var(--mute)}
li{margin:3px 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand" aria-label="Battlemax"><svg width="22" height="24" viewBox="0 0 64 70" aria-hidden="true"><path d="M14 10 50 54M50 10 14 54" stroke="#3a2412" stroke-width="9" stroke-linecap="round"/><path d="M14 10 50 54M50 10 14 54" stroke="#d9dde3" stroke-width="4.5" stroke-linecap="round"/><path d="M10 14h44v22c0 16-10 26-22 31C20 62 10 52 10 36Z" fill="#d8402e" stroke="#3a2412" stroke-width="4" stroke-linejoin="round"/><path d="M15 18h34v17c0 12-7 20-17 24-10-4-17-12-17-24Z" fill="none" stroke="#f2b93b" stroke-width="2.5"/><path d="M22 30l5 4 5-9 5 9 5-4-2 12H24Z" fill="#f2b93b" stroke="#3a2412" stroke-width="2" stroke-linejoin="round"/></svg><span>BATTLEMAX</span></div>
    <div class="chip" id="dayChip">Day 1</div>
    <div class="chip" id="turnChip"><span class="dot" id="turnDot"></span><span id="turnName">Crimson</span></div>
    <div class="chip" id="fundsChip">0</div>
    <div class="grow"></div>
    <button class="acct" id="acctBtn" aria-label="Account"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
    <button class="icon" id="fbBtn" aria-label="Send feedback" title="Send feedback"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></button>
    <button class="icon" id="menuBtn" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  </header>
  <div id="coBar"></div>
  <div id="board"><canvas id="cv"></canvas></div>
  <div id="panel">
    <div id="info"></div>
    <div id="btns"></div>
  </div>
</div>
<div class="modal hide" id="modal"><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>
<div class="fx hide" id="pwr"></div>
<div class="fx hide" id="vic"></div>
<div class="battle hide" id="battle">
  <canvas id="bcv"></canvas>
  <div class="bbar"><span>Tap to skip</span><button id="bOff">Turn off animations</button></div>
</div>

<script>
"use strict";
// ---------- DATA ----------
const W = 12, H = 16, DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const SIDES = {
  red:  {n:'Crimson', c:'#d8402e', d:'#6e1a10'},
  blue: {n:'Azure', c:'#2f74d0', d:'#132f66'}
};
const TER = {
  '.': {n:'Plain', s:1}, 'f': {n:'Forest', s:2}, 'm': {n:'Mountain', s:4},
  '=': {n:'Road', s:0}, 'b': {n:'Bridge', s:0}, '~': {n:'River', s:0}, 'w': {n:'Sea', s:0},
  'c': {n:'City', s:3, prop:1}, 'F': {n:'Factory', s:3, prop:1, build:1}, 'H': {n:'HQ', s:4, prop:1, hq:1}
};
const MC = {
  foot:   {'.':1,f:1,m:2,'=':1,b:1,'~':2,c:1,F:1,H:1},
  boots:  {'.':1,f:1,m:1,'=':1,b:1,'~':1,c:1,F:1,H:1},
  treads: {'.':1,f:2,'=':1,b:1,c:1,F:1,H:1},

  air:    {'.':1,f:1,m:1,'=':1,b:1,'~':1,w:1,c:1,F:1,H:1}
};
const ORDER = ['rifle','rocket','scout','tank','heavy','howitzer','flak','gunship'];
const U = {
  rifle:    {n:'Footman',     cost:1000,  mv:3, v:2, mt:'foot',   r:[1,1], cap:1, d:'Cheap. Captures.'},
  rocket:   {n:'Pikeman', cost:3000,  mv:2, v:2, mt:'boots',  r:[1,1], cap:1, d:'Captures. Anti-armor.'},
  scout:    {n:'Rider',     cost:4000,  mv:8, v:5, mt:'tires',  r:[1,1], d:'Fast. Sees far. Hunts infantry.'},
  howitzer: {n:'Catapult',  cost:6000,  mv:5, v:1, mt:'treads', r:[2,3], ind:1, d:'Range 2–3. No move+fire.'},
  tank:     {n:'Knight',      cost:7000,  mv:6, v:3, mt:'treads', r:[1,1], d:'All-rounder.'},
  flak:     {n:'Ballista',      cost:8000,  mv:6, v:2, mt:'treads', r:[1,1], d:'Shreds griffins and infantry.'},
  gunship:  {n:'Griffin',   cost:9000,  mv:6, v:3, mt:'air',    r:[1,1], air:1, d:'Flies. Ignores terrain.'},
  heavy:    {n:'Golem',cost:16000, mv:5, v:1, mt:'treads', r:[1,1], d:'Dominates ground.'}
};
// attacker -> defender, columns in ORDER. null = cannot attack.
const DMG = {
  rifle:    [ 55, 45, 12,  5,  1, 15,  5,  7],
  rocket:   [ 65, 55, 85, 55, 15, 70, 65,  9],
  scout:    [ 70, 65, 35,  6,  1, 45,  4, 10],
  tank:     [ 75, 70, 85, 55, 15, 70, 65, 10],
  heavy:    [105, 95,105, 85, 55,105,105, 12],
  howitzer: [ 90, 85, 80, 70, 45, 75, 75,null],
  flak:     [105,105, 60, 25, 10, 50, 45,120],
  gunship:  [ 75, 75, 55, 55, 25, 65, 25, 65]
};
const base = (a,d) => DMG[a][ORDER.indexOf(d)];
const FOOT = t => !!U[t].cap;
const VEH  = t => !U[t].cap && !U[t].air;

// ---------- COMMANDERS ----------
// atk/def return % bonuses; p = active power ('cop' | 'scop' | null)
const COS = {
  vance: {n:'Halden', tag:'Balanced', d2d:'No strengths, no weaknesses. Cheap, fast-charging powers.',
    cop:{n:'Healing Light', stars:2, d:'All your units heal 2 HP.'},
    scop:{n:'Royal Rally', stars:5, d:'All your units heal 5 HP.'}},
  bruna: {n:'Brunhild', tag:'Cavalry', d2d:'Cavalry and siege +20% attack. Foot units −10% attack.',
    cop:{n:'Charge', stars:3, d:'Cavalry and siege +1 move and +20% more attack.'},
    scop:{n:'Stampede', stars:6, d:'Cavalry and siege +2 move and +40% more attack.'},
    atk:(t,p) => VEH(t) ? 20 + (p==='cop'?20:p==='scop'?40:0) : FOOT(t) ? -10 : 0,
    mv:(t,p) => VEH(t) ? (p==='cop'?1:p==='scop'?2:0) : 0},
  ash: {n:'Orrin', tag:'Artillery', d2d:'Catapults +25% attack. Direct-fire units −10% attack.',

  mira: {n:'Nyssa', tag:'Economy', d2d:'Units cost 10% less. All units −10% attack.',
    cop:{n:'Tax Day', stars:3, d:'Instantly gain 1,000 G per property you own.'},
    scop:{n:'War Chest', stars:6, d:'All units heal 3 HP and get +20% attack.'},
    atk:(t,p) => -10 + (p==='scop'?20:0), costMul:0.9},
  rook: {n:'Bastion', tag:'Defense', d2d:'All units +10% defense.',
    cop:{n:'Shield Wall', stars:3, d:'Ground units +1 terrain star and +15% defense.'},
    scop:{n:'Fortress', stars:6, d:'Ground units +2 terrain stars and +30% defense.'},
    def:(t,p) => 10 + (p==='cop'?15:p==='scop'?30:0),
    stars:(t,p) => U[t].air ? 0 : (p==='cop'?1:p==='scop'?2:0)},
  sable: {n:'Vey', tag:'Infantry', d2d:'Foot units +20% attack and capture 50% faster.',
    cop:{n:'Forced March', stars:3, d:'Foot units +1 move and +20% more attack.'},
    scop:{n:'Uprising', stars:6, d:'Foot units +2 move, +40% more attack, capture twice as fast.'},
    atk:(t,p) => FOOT(t) ? 20 + (p==='cop'?20:p==='scop'?40:0) : 0,
    mv:(t,p) => FOOT(t) ? (p==='cop'?1:p==='scop'?2:0) : 0,
    capMul:p => p==='scop' ? 2 : 1.5}
};
const STAR = 5000; // funds of damage value per star

const TOP = [
  "wwm..c...fmw",
  "wc.F=H=F..cw",
  "w.f..=...f.w",
  "..c.====.c..",
  ".m..f=..m..f",
  "f..c.=.~~c..",
  "..~~~b~~..m.",
  "c.f..==.f.c."
];
const ROWS = TOP.concat(TOP.slice().reverse().map(r => r.split('').reverse().join('')));

// ---------- STATE ----------
let G = null, ui = {mode:'idle'}, busy = false;
let settings = {luck:true, fog:false, anim:true};
try { Object.assign(settings, JSON.parse(localStorage.getItem('advcombat.settings') || '{}')); } catch(e){}
const saveSettings = () => { try { localStorage.setItem('advcombat.settings', JSON.stringify(settings)); } catch(e){} };
let rngState = 1;
function rng(){ rngState |= 0; rngState = rngState + 0x6D2B79F5 | 0; let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const other = s => s === 'red' ? 'blue' : 'red';
const inb = (x,y) => x>=0 && y>=0 && x<W && y<H;
const key = (x,y) => y*W + x;
const kx = k => k % W, ky = k => Math.floor(k / W);
const tile = (x,y) => G.tiles[y][x];
const unitAt = (x,y) => G.units.find(u => u.x===x && u.y===y && u.hp>0);
const disp = hp => Math.ceil(hp/10);
const isAI = s => G.mode === 'ai' && s === 'blue';
const viewer = () => G.mode === 'ai' ? 'red' : G.turn;
const mdist = (ax,ay,bx,by) => Math.abs(ax-bx) + Math.abs(ay-by);

// CO-aware stats
const coOf = s => COS[G.co[s]];
const pw = s => G.power[s];
function atkOf(u){ const c = coOf(u.side); return 100 + (c.atk ? c.atk(u.type, pw(u.side)) : 0) + (pw(u.side) ? 10 : 0); }
function defOf(u){ const c = coOf(u.side); return 100 + (c.def ? c.def(u.type, pw(u.side)) : 0) + (pw(u.side) ? 10 : 0); }
function mvOf(u){ const c = coOf(u.side); return U[u.type].mv + (c.mv ? c.mv(u.type, pw(u.side)) : 0); }
function rangeOf(u){ const c = coOf(u.side), r = U[u.type].r; return [r[0], r[1] + (c.rng ? c.rng(u.type, pw(u.side)) : 0)]; }
function starsAt(u,x,y){ if (U[u.type].air) return 0; const c = coOf(u.side); return TER[tile(x,y).t].s + (c.stars ? c.stars(u.type, pw(u.side)) : 0); }
function costOf(s,t){ return Math.round(U[t].cost * (coOf(s).costMul || 1)); }
function capMul(s){ const c = coOf(s); return c.capMul ? c.capMul(pw(s)) : 1; }
function starCost(s){ return STAR * (1 + 0.2 * Math.min(G.uses[s], 5)); }
function powerCost(s,k){ return coOf(s)[k].stars * starCost(s); }
function canPower(s,k){ return !G.power[s] && G.meter[s] >= powerCost(s,k) - 0.001; }

function stat(s){
  if (!G.stats) G.stats = {};
  if (!G.stats[s]) G.stats[s] = {built:0, spent:0, destroyed:0, lost:0, dmg:0, captures:0, earned:0, repairs:0};
  return G.stats[s];
}
function newGame(mode, luck, fog, co){
  G = {mode, luck, fog, co, day:1, turn:'red', funds:{red:0, blue:0}, meter:{red:0,blue:0}, uses:{red:0,blue:0}, power:{red:null,blue:null},
       tiles:[], units:[], nextId:1, over:null, seed:(Date.now() % 2147483647)};
  rngState = G.seed;
  for (let y=0; y<H; y++){
    const row = [];
    for (let x=0; x<W; x++){
      const ch = ROWS[y][x];
      let owner = null;
      if (ch==='F' || ch==='H') owner = y < 8 ? 'blue' : 'red';
      row.push({t:ch, owner, cap:20, capBy:null});
    }
    G.tiles.push(row);
  }
  addUnit('rifle','blue',4,2); addUnit('rifle','blue',6,2);
  addUnit('rifle','red',7,13); addUnit('rifle','red',5,13);
  ui = {mode:'idle'};
  startTurn(true);
}
function addUnit(type, side, x, y){
  const u = {id:G.nextId++, type, side, x, y, hp:100, acted:false};
  G.units.push(u); return u;
}

// ---------- VISION (fog of war) ----------
function visFor(s){
  const R = new Set(), A = new Set();
  const mark = (cx,cy,v) => {
    for (let y=Math.max(0,cy-v); y<=Math.min(H-1,cy+v); y++) for (let x=Math.max(0,cx-v); x<=Math.min(W-1,cx+v); x++){
      const d = mdist(cx,cy,x,y);
      if (d <= v){ R.add(key(x,y)); if (d <= 1) A.add(key(x,y)); }
    }
  };
  for (const u of G.units) if (u.side === s && u.hp > 0) mark(u.x, u.y, U[u.type].v + (FOOT(u.type) && tile(u.x,u.y).t==='m' ? 3 : 0));
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){ const t = tile(x,y); if (t.owner === s && TER[t.t].prop) mark(x,y,1); }
  return {R, A, side:s};
}
// V = null means no fog: everything visible
function canSee(V, e, x, y){
  if (!V || e.side === V.side) return true;
  if (x === undefined){ x = e.x; y = e.y; }
  const k = key(Math.round(x), Math.round(y));
  if (!V.R.has(k)) return false;
  if (tile(Math.round(x), Math.round(y)).t === 'f' && !U[e.type].air && !V.A.has(k)) return false;
  return true;
}
const viewVis = () => G.fog ? visFor(viewer()) : null;

// ---------- RULES ----------
function reach(u, V){
  const mt = U[u.type].mt, mv = mvOf(u);
  const best = new Map(); best.set(key(u.x,u.y), {c:0, p:-1});
  const q = [[0, u.x, u.y]];
  while (q.length){
    q.sort((a,b) => a[0]-b[0]);
    const [c,x,y] = q.shift();
    if (c > best.get(key(x,y)).c) continue;
    for (const [dx,dy] of DIRS){
      const nx = x+dx, ny = y+dy;
      if (!inb(nx,ny)) continue;
      const cost = MC[mt][tile(nx,ny).t];
      if (cost == null) continue;
      const o = unitAt(nx,ny);
      if (o && o.side !== u.side && canSee(V,o)) continue;
      const nc = c + cost;
      if (nc > mv) continue;
      const e = best.get(key(nx,ny));
      if (!e || nc < e.c){ best.set(key(nx,ny), {c:nc, p:key(x,y)}); q.push([nc,nx,ny]); }
    }
  }
  const end = new Map();
  for (const [k,v] of best){
    const o = unitAt(kx(k), ky(k));
    if (!o || o === u || canJoin(u,o) || (o.side !== u.side && !canSee(V,o))) end.set(k,v);
  }
  end.all = best;
  return end;
}
function pathTo(R, k){
  const p = []; let cur = k;
  while (cur !== -1){ p.push([kx(cur), ky(cur)]); cur = R.all.get(cur).p; }
  return p.reverse();
}
// stop before a hidden enemy (fog trap)
function trimPath(u, path){
  for (let i=1; i<path.length; i++){
    const o = unitAt(path[i][0], path[i][1]);
    if (o && o.side !== u.side){
      let j = i - 1;
      while (j > 0){ const f = unitAt(path[j][0], path[j][1]); if (!f || f === u) break; j--; }
      return {path:path.slice(0, j+1), trap:path[i]};
    }
  }
  return {path, trap:null};
}
function dmgPct(a, d, ahp, dhp, dStars, luck){
  const b = base(a.type, d.type);
  if (b == null) return null;
  const pct = (b * atkOf(a) / 100 + luck) * (disp(ahp)/10) * (200 - (defOf(d) + dStars*disp(dhp))) / 100;
  return Math.max(0, Math.floor(pct));
}
function canHit(a, ax, ay, d){
  if (d.side === a.side) return false;
  if (base(a.type, d.type) == null) return false;
  const dist = mdist(ax,ay,d.x,d.y), r = rangeOf(a);
  return dist >= r[0] && dist <= r[1];
}
function targetsFrom(a, x, y, moved, V){
  if (U[a.type].ind && moved) return [];
  return G.units.filter(d => d.hp>0 && canHit(a, x, y, d) && canSee(V, d));
}
function canJoin(u, o){
  return !!o && o !== u && o.side === u.side && o.type === u.type && (o.hp < 100 || u.hp < 100);
}
function joinPartner(u){ return G.units.find(o => o !== u && o.hp > 0 && o.x === u.x && o.y === u.y); }
function doJoin(u, o){
  const extra = disp(u.hp) + disp(o.hp) - 10;
  o.hp = Math.min(100, o.hp + u.hp);
  if (extra > 0){ const g = extra * U[u.type].cost / 10; G.funds[u.side] += g; floatText(o.x, o.y, '+' + g.toLocaleString() + ' G', '#7fe08a'); }
  else floatText(o.x, o.y, 'Joined ' + disp(o.hp) + ' HP', '#7fe08a');
  o.acted = true;
  u.hp = 0;
  G.units = G.units.filter(x => x.hp > 0);
}
function canCapture(u){
  if (!U[u.type].cap) return false;
  const t = tile(u.x,u.y);
  return TER[t.t].prop && t.owner !== u.side;
}
function killUnit(u){
  u.hp = 0;
  for (const row of G.tiles) for (const t of row) if (t.capBy === u.id){ t.cap = 20; t.capBy = null; }
  G.units = G.units.filter(x => x.hp > 0);
}
function leaveTile(u, ox, oy){
  if (ox === u.x && oy === u.y) return;
  const t = tile(ox,oy);
  if (t.capBy === u.id){ t.cap = 20; t.capBy = null; }
}
function charge(s, v){ if (G.power[s]) return; G.meter[s] = Math.min(powerCost(s,'scop'), G.meter[s] + v); }
function doAttack(a, d){
  const L = () => G.luck ? Math.floor(rng()*10) : 0;
  const rec = {aRef:a, dRef:d, aType:a.type, dType:d.type, aSide:a.side, dSide:d.side,
    aTer:tile(a.x,a.y).t, dTer:tile(d.x,d.y).t, aHp0:a.hp, dHp0:d.hp, ind:mdist(a.x,a.y,d.x,d.y) > 1, counter:false, fx:[]};
  const ax = a.x, ay = a.y, dx = d.x, dy = d.y;
  const dealt = dmgPct(a, d, a.hp, d.hp, starsAt(d,d.x,d.y), L());
  const dv = Math.min(dealt, d.hp)/100 * U[d.type].cost;
  charge(a.side, dv*0.5); charge(d.side, dv);
  stat(a.side).dmg += dv;
  d.hp -= dealt;
  rec.fx.push(() => floatText(dx, dy, '-' + dealt + '%', '#ffd36b'));
  if (d.hp <= 0){ rec.fx.push(() => boom(dx,dy)); stat(a.side).destroyed++; stat(d.side).lost++; killUnit(d); }
  else if (mdist(a.x,a.y,d.x,d.y) === 1 && !U[d.type].ind && base(d.type, a.type) != null){
    const taken = dmgPct(d, a, d.hp, a.hp, starsAt(a,a.x,a.y), L());
    const tv = Math.min(taken, a.hp)/100 * U[a.type].cost;
    charge(d.side, tv*0.5); charge(a.side, tv);
    stat(d.side).dmg += tv;
    a.hp -= taken; rec.counter = true;
    rec.fx.push(() => floatText(ax, ay, '-' + taken + '%', '#ff9b8a'));
    if (a.hp <= 0){ rec.fx.push(() => boom(ax,ay)); stat(d.side).destroyed++; stat(a.side).lost++; killUnit(a); }
  }
  rec.aHp1 = Math.max(0, a.hp); rec.dHp1 = Math.max(0, d.hp);
  checkWin();
  return rec;
}
function doCapture(u){
  const t = tile(u.x,u.y);
  t.cap -= Math.floor(disp(u.hp) * capMul(u.side)); t.capBy = u.id;
  if (t.cap <= 0){
    t.owner = u.side; t.cap = 20; t.capBy = null;
    stat(u.side).captures++;
    if (TER[t.t].hq) G.winBy = 'hq';
    floatText(u.x,u.y,'Captured!','#fff');
    if (TER[t.t].hq) { G.over = u.side; }
  } else floatText(u.x,u.y, (20 - Math.max(0,t.cap)) + '/20', '#fff');
}
function checkWin(){
  if (G.over) return;
  for (const s of ['red','blue']) if (!G.units.some(u => u.side === s)){ G.over = other(s); G.winBy = 'rout'; }
}
function propsOf(s){ let n = 0; for (const row of G.tiles) for (const t of row) if (t.owner === s && TER[t.t].prop) n++; return n; }
const income = s => propsOf(s) * 1000;
const heal = (s, n) => { for (const u of G.units) if (u.side === s){ const before = u.hp; u.hp = Math.min(100, u.hp + n); if (u.hp > before) floatText(u.x, u.y, '+' + Math.round((u.hp - before)/10), '#7fe08a'); } };

async function activate(s, k){
  const c = coOf(s), p = c[k];
  G.meter[s] = Math.max(0, G.meter[s] - powerCost(s,k));
  G.uses[s]++;
  G.power[s] = k;
  const wasBusy = busy; busy = true; updatePanel();
  if (settings.anim) await playPower(s, k);
  busy = wasBusy;
  const id = G.co[s];
  if (id === 'vance') heal(s, k === 'cop' ? 20 : 50);
  if (id === 'mira' && k === 'cop'){ const g = propsOf(s) * 1000; G.funds[s] += g; }
  if (id === 'mira' && k === 'scop') heal(s, 30);
  if (id === 'ash' && k === 'scop') for (const u of G.units) if (u.side !== s){ stat(s).dmg += (u.hp - Math.max(10, u.hp - 20))/100 * U[u.type].cost; u.hp = Math.max(10, u.hp - 20); floatText(u.x, u.y, '-2', '#ffd36b'); boom(u.x, u.y); }
  if (!settings.anim) toast(`${c.n}: ${p.n}!`, true);
  save(); refresh();
}

function startTurn(first){
  const s = G.turn;
  G.power[s] = null;
  G.funds[s] += income(s); stat(s).earned += income(s);
  for (const u of G.units){
    if (u.side !== s) continue;
    u.acted = false;
    const t = tile(u.x,u.y);
    if (!U[u.type].air && t.owner === s && TER[t.t].prop && u.hp < 100){
      const h = Math.min(20, 100 - u.hp);
      const cost = Math.ceil(h/10) * U[u.type].cost / 10;
      if (G.funds[s] >= cost){ G.funds[s] -= cost; u.hp += h; stat(s).repairs += cost; }
    }
  }
  ui = {mode:'idle'};
  save(); refresh();
  if (isAI(s)) { toast(`Day ${G.day} · ${SIDES[s].n} (AI)`); runAI(); }
  else if (G.mode === 'hot' && !first) passScreen();
  else toast(`Day ${G.day} · ${SIDES[s].n}`);
}
function endTurn(){
  if (G.over) return;
  G.turn = other(G.turn);
  if (G.turn === 'red') G.day++;
  startTurn(false);
}

// ---------- RENDER ----------
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');
let T = 32, dpr = 1;
function resize(){
  const avail = Math.min(window.innerWidth - 18, 704);
  const availH = window.innerHeight - 270;
  T = Math.max(20, Math.floor(Math.min(avail / W, availH / H)));
  dpr = window.devicePixelRatio || 1;
  cv.width = W*T*dpr; cv.height = H*T*dpr;
  cv.style.width = W*T + 'px'; cv.style.height = H*T + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  render();
}
let anims = [], moving = null, raf = 0;
function kick(){ if (!raf) raf = requestAnimationFrame(loop); }
function loop(){ raf = 0; render(); if (anims.length || moving) kick(); }
function floatText(x,y,txt,col){ anims.push({k:'txt',x,y,txt,col,t0:performance.now()}); kick(); }
function boom(x,y){ anims.push({k:'boom',x,y,t0:performance.now()}); kick(); }
function animateMove(u, path){
  if (path.length < 2) return Promise.resolve();
  return new Promise(res => { moving = {u, path, t0:performance.now(), res}; kick(); });
}

function pine(c, x, base, h){

let VIEW = null;
function render(){

  if (VIEW){
    ctx.fillStyle='rgba(30,18,6,.48)';
    for (let y=0;y<H;y++) for (let x=0;x<W;x++) if (!VIEW.R.has(key(x,y))) ctx.fillRect(x*T,y*T,T,T);
  }

  }

    for (const d of ui.targets){

      ctx.fillRect(d.x*T+1, d.y*T+1, T-2, T-2);
    }
  }
  for (const u of G.units){
    if (moving && moving.u === u) continue;
    if (!canSee(VIEW, u)) continue;
    drawUnit(u, u.x, u.y);
  }
  if (moving){
    const {u, path, t0} = moving;
    const step = (now - t0) / 75;
    if (step >= path.length - 1){
      const m = moving; moving = null;
      const [lx,ly] = path[path.length-1];
      if (canSee(VIEW, u, lx, ly)) drawUnit(u, lx, ly);
      m.res();
    } else {
      const i = Math.floor(step), f = step - i;
      const [ax,ay] = path[i], [bx,by] = path[i+1];
      const fx = ax + (bx-ax)*f, fy = ay + (by-ay)*f;
      if (canSee(VIEW, u, fx, fy)) drawUnit(u, fx, fy);
    }
  }

    const s = ui.sel; ctx.strokeStyle='#f2b93b'; ctx.lineWidth=3;

    if (VIEW && !VIEW.R.has(key(a.x,a.y))) continue;
    const p = (now - a.t0) / 900;

      ctx.globalAlpha = 1 - p;

      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.8)';

      ctx.strokeText(a.txt, x, y); ctx.fillStyle = a.col; ctx.fillText(a.txt, x, y);
      ctx.globalAlpha = 1;
    } else {
      const r = T*(.2 + p*.5);
      ctx.globalAlpha = 1 - p;
      ctx.fillStyle = '#f2b93b'; ctx.beginPath(); ctx.arc(a.x*T+T/2, a.y*T+T/2, r, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(a.x*T+T/2, a.y*T+T/2, r*.5, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

const $ = id => document.getElementById(id);
function meterHTML(s){
  const full = powerCost(s,'scop'), cop = powerCost(s,'cop');
  const f = Math.min(1, G.meter[s] / full);
  const cls = G.meter[s] >= full - 0.001 ? 'ready full' : G.meter[s] >= cop - 0.001 ? 'ready' : '';
  return `<div class="meter ${G.power[s] ? '' : cls}" title="${Math.floor(G.meter[s])} / ${Math.ceil(full)}"><i style="width:${(f*100).toFixed(1)}%"></i><b style="left:${(cop/full*100).toFixed(1)}%"></b></div>`;
}
function renderCoBar(){

function setPanel(html, btns){

function tileInfo(x,y){

}
function unitInfo(u){
  const d = U[u.type], r = rangeOf(u);
  return `<b style="color:${SIDES[u.side].c}">${d.n}</b> · ${disp(u.hp)}/10 HP · Move ${mvOf(u)} · Range ${r[0]===r[1]?r[0]:r.join('–')} · Atk ${atkOf(u)}% — ${d.d}`;
}
function updatePanel(){
  if (!G) return;
  if (G.over){ setPanel(`<b>${SIDES[G.over].n} wins.</b>`, [{l:'New game', c:'pri', f:openMenu}]); return; }
  if (busy || isAI(G.turn)){ setPanel(`${SIDES[G.turn].n} is moving…`, []); return; }
  const endBtn = {l:'End turn', c:'pri', f:confirmEnd};
  if (ui.mode === 'idle'){
    const s = G.turn, c = coOf(s);
    const ready = G.units.filter(u => u.side===s && !u.acted).length;
    let html = ui.info || `Tap a unit to move it, or an empty factory to build. <b>${ready}</b> unit${ready===1?'':'s'} ready · income ${income(s).toLocaleString()} G.`;
    const btns = [];
    if (canPower(s,'scop')) btns.push({l:'⚡ ' + c.scop.n, c:'pow', f:() => confirmPower(s,'scop')});
    if (canPower(s,'cop')) btns.push({l:'⚡ ' + c.cop.n, c:'pow', f:() => confirmPower(s,'cop')});
    btns.push(endBtn);
    setPanel(html, btns);
  } else if (ui.mode === 'move'){
    setPanel(unitInfo(ui.sel) + '<br>On: ' + tileInfo(ui.sel.x, ui.sel.y) + '<br>Tap a highlighted tile (or the unit itself to stay). Move onto a damaged unit of the same type to Join.', [{l:'Cancel', f:clearUI}]);
  } else if (ui.mode === 'action'){
    const u = ui.sel, moved = (u.x!==ui.ox || u.y!==ui.oy);
    const partner = moved ? joinPartner(u) : null;
    if (partner){
      const total = disp(u.hp) + disp(partner.hp), extra = Math.max(0, total - 10);
      setPanel(`<b>Join</b> two ${U[u.type].n}s → ${Math.min(10,total)}/10 HP` + (extra ? ` · refund ${(extra*U[u.type].cost/10).toLocaleString()} G for the extra ${extra} HP` : '') + '. The joined unit can’t act again this turn.',
        [{l:'Join', c:'pri', f:() => commit(() => doJoin(u, partner))}, {l:'Back', f:undoMove}]);
      return;
    }
    const tg = targetsFrom(u, u.x, u.y, moved, VIEW);
    const btns = [];
    if (tg.length) btns.push({l:'Fire', c:'pri', f:() => { ui.mode='target'; ui.targets=tg; updatePanel(); render(); }});
    else if (U[u.type].ind && moved) btns.push({l:'Fire', dis:true, f:()=>{}});
    if (canCapture(u)) btns.push({l:'Capture', c:'pri', f:() => commit(() => doCapture(u))});
    btns.push({l:'Wait', f:() => commit(() => {})});
    btns.push({l:'Back', f:undoMove});
    setPanel(unitInfo(u) + (U[u.type].ind && moved ? '<br>Catapults can’t move and fire on the same turn.' : ''), btns);
  } else if (ui.mode === 'target'){
    setPanel('Tap a red target to see the damage forecast.', [{l:'Back', f:() => { ui.mode='action'; ui.targets=null; updatePanel(); render(); }}]);
  } else if (ui.mode === 'preview'){
    const a = ui.sel, d = ui.target, f = forecast(a,d);
    let html = `<b>${U[a.type].n}</b> → <b style="color:${SIDES[d.side].c}">${U[d.type].n}</b> (${disp(d.hp)} HP, ${starsAt(d,d.x,d.y)}★)<br>`;
    html += `Deal <b>${f.dmin}${f.dmax!==f.dmin?'–'+f.dmax:''}%</b>` + (f.kill ? ' · <b style="color:#7fe08a">can destroy</b>' : '');
    html += f.counter ? ` · Take <b>${f.cmin}${f.cmax!==f.cmin?'–'+f.cmax:''}%</b> back` : ' · no counter';
    setPanel(html, [
      {l:'Fire!', c:'pri', f:() => commit(() => doAttack(a, d))},
      {l:'Back', f:() => { ui.mode='target'; ui.target=null; updatePanel(); render(); }}
    ]);
  }
}
function forecast(a, d){
  const ds = starsAt(d,d.x,d.y), as = starsAt(a,a.x,a.y);
  const dmin = dmgPct(a,d,a.hp,d.hp,ds,0), dmax = G.luck ? dmgPct(a,d,a.hp,d.hp,ds,9) : dmin;
  const canCounter = mdist(a.x,a.y,d.x,d.y)===1 && !U[d.type].ind && base(d.type,a.type)!=null;
  let counter = false, cmin = 0, cmax = 0;
  if (canCounter && d.hp - dmin > 0){
    counter = true;
    cmax = dmgPct(d,a,d.hp-dmin,a.hp,as,G.luck?9:0);
    cmin = d.hp - dmax > 0 ? dmgPct(d,a,d.hp-dmax,a.hp,as,0) : 0;
  }
  return {dmin, dmax, counter, cmin, cmax, kill: dmax >= d.hp};
}
function clearUI(){ ui = {mode:'idle'}; updatePanel(); render(); }
function undoMove(){
  const u = ui.sel; u.x = ui.ox; u.y = ui.oy;
  ui = {mode:'idle'}; updatePanel(); render();
}
async function commit(fn){
  const u = ui.sel;
  leaveTile(u, ui.ox, ui.oy);
  ui = {mode:'idle'};
  busy = true;
  const rec = fn();
  u.acted = true;
  if (rec && rec.fx){ save(); updatePanel(); render(); await showBattle(rec); }
  busy = false;
  save(); refresh();
}
function onTap(x, y){
  if (!G || busy || G.over || isAI(G.turn)) return;
  let u = unitAt(x,y); const t = tile(x,y);
  if (u && !canSee(VIEW, u)) u = null;
  ui.cursor = [x,y];
  if (ui.mode === 'idle'){
    ui.danger = null; ui.info = null;
    if (u && u.side === G.turn && !u.acted){
      ui = {mode:'move', sel:u, reach:reach(u, VIEW), cursor:[x,y]};
    } else if (u && u.side !== G.turn){
      ui.danger = threatSet(u);
      ui.info = unitInfo(u) + '<br><span style="color:#ff8a78">Red = where it can strike next turn.</span><br>' + tileInfo(x,y);
    } else if (!u && t.t==='F' && t.owner===G.turn && !unitAt(x,y)){
      openBuild(x,y);
    } else {
      ui.info = (u ? unitInfo(u) + '<br>' : '') + tileInfo(x,y);
    }
  } else if (ui.mode === 'move'){
    const k = key(x,y);
    if (ui.reach.has(k)){
      const s = ui.sel, ox = s.x, oy = s.y;
      const {path, trap} = trimPath(s, pathTo(ui.reach, k));
      busy = true; updatePanel();
      animateMove(s, path).then(() => {
        const [ex,ey] = path[path.length-1];
        s.x = ex; s.y = ey; busy = false;
        if (trap){
          floatText(trap[0], trap[1], 'Trap!', '#ff6b5a');
          leaveTile(s, ox, oy); s.acted = true;
          ui = {mode:'idle', info:'<b style="color:#ff8a78">Ambushed!</b> A hidden enemy blocked the path. That unit’s turn is over.'};
          save(); refresh();
        } else {
          ui = {mode:'action', sel:s, ox, oy, cursor:[ex,ey]};
          updatePanel(); render();
        }
      });
      return;
    } else { ui = {mode:'idle', cursor:[x,y]}; }
  } else if (ui.mode === 'action'){
    return;
  } else if (ui.mode === 'target' || ui.mode === 'preview'){
    const d = ui.targets.find(d => d.x===x && d.y===y);
    if (d){ ui.mode = 'preview'; ui.target = d; }
    else { ui.mode = 'action'; ui.targets = null; ui.target = null; }
  }
  updatePanel(); render();
}
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / (r.width / W)), y = Math.floor((e.clientY - r.top) / (r.height / H));
  if (inb(x,y)) onTap(x,y);
});
function threatSet(e){
  const set = new Set(), r = rangeOf(e);
  const from = U[e.type].ind ? [[e.x,e.y]] : [...reach(e, null).keys()].map(k => [kx(k),ky(k)]);
  for (const [fx,fy] of from)
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      const dist = mdist(fx,fy,x,y);
      if (dist >= r[0] && dist <= r[1]) set.add(key(x,y));
    }
  return set;
}

function sceneSide(rec, which, t, P, w, h){

  let h = `<div class="vrank"><span class="rk rk-${r.letter}">${r.letter}</span><div><b>${coOf(w).n} ${how} on day ${G.day}</b><small>Speed ${r.speed} · Power ${r.power} · Technique ${r.tech} → ${r.score} pts</small></div></div>`;

  return h + '</div>';
}

const LOGO = `<div class="logo"><svg width="52" height="57" viewBox="0 0 64 70" aria-hidden="true"><path d="M14 10 50 54M50 10 14 54" stroke="#3a2412" stroke-width="9" stroke-linecap="round"/><path d="M14 10 50 54M50 10 14 54" stroke="#d9dde3" stroke-width="4.5" stroke-linecap="round"/><path d="M10 14h44v22c0 16-10 26-22 31C20 62 10 52 10 36Z" fill="#d8402e" stroke="#3a2412" stroke-width="4" stroke-linejoin="round"/><path d="M15 18h34v17c0 12-7 20-17 24-10-4-17-12-17-24Z" fill="none" stroke="#f2b93b" stroke-width="2.5"/><path d="M22 30l5 4 5-9 5 9 5-4-2 12H24Z" fill="#f2b93b" stroke="#3a2412" stroke-width="2" stroke-linejoin="round"/></svg><div><div class="wm">BATTLE<b>MAX</b></div><small>A TACTICS SAGA</small></div></div>`;

  <div class="row"><button id="mAcct">Account</button><button id="mBoard">Leaderboard</button></div>

  $('mLuck').onclick = () => { settings.luck = !settings.luck; saveSettings(); $('mLuck').textContent = 'Luck: ' + (settings.luck ? 'On' : 'Off'); };
  $('mAnim').onclick = () => { settings.anim = !settings.anim; saveSettings(); $('mAnim').textContent = 'Animations: ' + (settings.anim ? 'On' : 'Off'); };
  $('mFog').onclick = () => { settings.fog = !settings.fog; saveSettings(); $('mFog').textContent = 'Fog of war: ' + (settings.fog ? 'On' : 'Off'); };
  $('mAI').onclick = () => pickCOs('ai');
  $('mHot').onclick = () => pickCOs('hot');
  $('mHelp').onclick = help;
  $('mAcct').onclick = () => Online.openAccount();
  $('mBoard').onclick = () => Online.openLeaderboard();
  $('mHist').onclick = () => Online.openHistory();

  if ($('mClose')) $('mClose').onclick = closeModal;
}
function pickCOs(mode){
  const picks = {};
  const ask = (side, done) => {
    coPickSide = side;
    let h = `<h2 style="color:${SIDES[side].c}">${SIDES[side].n}: choose a commander</h2><div class="grid one">`;
    for (const id in COS) h += `<button data-co="${id}">${coCard(id)}</button>`;
    h += `</div><div class="row"><button id="mBack">Back</button></div>`;
    modal(h, mode === 'hot' && side === 'blue');
    $('card').querySelectorAll('[data-co]').forEach(b => b.onclick = () => { picks[side] = b.dataset.co; done(); });
    $('mBack').onclick = openMenu;
  };
  const start = () => { closeModal(); clearSave(); newGame(mode, settings.luck, settings.fog, picks); resize();
    if (typeof Online !== 'undefined') Online.track('game_start', { mode, co: picks, fog: !!settings.fog, luck: !!settings.luck }); };
  ask('red', () => {
    if (mode === 'hot') ask('blue', start);
    else { const pool = Object.keys(COS).filter(k => k !== picks.red); picks.blue = pool[Math.floor(Math.random()*pool.length)]; start(); }
  });
}

function passScreen(){
  const s = G.turn;
  modal(`<h2 style="color:${SIDES[s].c}">${SIDES[s].n}’s turn</h2><p>Day ${G.day}. Pass the phone.</p><div class="row"><button class="pri" id="mGo">Start turn</button></div>`, true);
  $('mGo').onclick = closeModal;

function gameOver(){
  if (!G.over || vicShownFor === G) return;
  vicShownFor = G;
  closeModal();
  showVictory();

let toastTimer = 0;
function toast(msg, big){ const t = $('toast'); t.textContent = msg; t.classList.toggle('big', !!big); t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), big ? 1800 : 1300); }
$('menuBtn').onclick = openMenu;

// ---------- SAVE ----------
function save(){ try { G.rng = rngState; localStorage.setItem('advcombat.save2', JSON.stringify(G)); } catch(e){} }
function clearSave(){ try { localStorage.removeItem('advcombat.save2'); } catch(e){} }
function load(){ try { const s = localStorage.getItem('advcombat.save2'); if (!s) return false; G = JSON.parse(s); rngState = G.rng || 1; return !G.over && !!G.co; } catch(e){ return false; } }

// ---------- AI ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
function distField(mt, goals){
  const d = new Array(W*H).fill(99), q = [];
  for (const [x,y] of goals){ d[key(x,y)] = 0; q.push([0,x,y]); }
  while (q.length){
    q.sort((a,b) => a[0]-b[0]);
    const [c,x,y] = q.shift();
    if (c > d[key(x,y)]) continue;
    for (const [dx,dy] of DIRS){
      const nx=x+dx, ny=y+dy; if (!inb(nx,ny)) continue;
      const cost = MC[mt][tile(nx,ny).t]; if (cost == null) continue;
      if (c + cost < d[key(nx,ny)]){ d[key(nx,ny)] = c + cost; q.push([c+cost,nx,ny]); }
    }
  }
  return d;
}
async function runAI(){
  busy = true; updatePanel();
  await sleep(500);
  const side = G.turn, foe = other(side);
  // commander powers
  if (!G.power[side]){
    const mine = G.units.filter(u => u.side === side);
    const hurt = mine.reduce((n,u) => n + (100 - u.hp), 0);
    const id = G.co[side];
    const worth = k => !(id === 'vance' || (id === 'mira' && k === 'scop')) || hurt >= 60;
    if (canPower(side,'scop') && worth('scop')) { await activate(side,'scop'); await sleep(400); }
    else if (canPower(side,'cop') && worth('cop') && G.meter[side] < powerCost(side,'scop')*0.75) { await activate(side,'cop'); await sleep(400); }
  }
  const luckAvg = G.luck ? 4.5 : 0;
  const order = G.units.filter(u => u.side === side).sort((a,b) => (U[b.type].ind?1:0) - (U[a.type].ind?1:0) || U[b.type].cost - U[a.type].cost);
  for (const u of order){
    if (G.over) break;
    if (u.hp <= 0 || u.acted) continue;
    const V = G.fog ? visFor(side) : null;
    const seenFoes = G.units.filter(e => e.side === foe && canSee(V, e));
    const propGoals = [], foeGoals = [];
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      const t = tile(x,y);
      if (TER[t.t].prop && t.owner !== side) propGoals.push([x,y]);
      if (TER[t.t].hq && t.owner === foe) foeGoals.push([x,y]);
    }
    for (const e of seenFoes) foeGoals.push([e.x,e.y]);
    const F = distField(U[u.type].mt, U[u.type].cap ? propGoals.concat(foeGoals) : foeGoals);
    const threats = seenFoes.map(e => ({e, set:threatSet(e)}));
    const threatFrac = (k, type) => {
      let f = 0;
      for (const {e,set} of threats){ if (e.hp<=0 || !set.has(k)) continue; const b = base(e.type, type); if (b != null) f += b * atkOf(e)/100 * disp(e.hp)/10 / 100; }
      return Math.min(f, 1.2);
    };
    const R = reach(u, V), cost = U[u.type].cost;
    let best = {s:-1e9};
    for (const [k] of R){
      const x = kx(k), y = ky(k), t = tile(x,y), stars = starsAt(u,x,y);
      const cover = Math.max(0, 1 - stars*disp(u.hp)/100);
      let pos = -F[k]*90 - threatFrac(k,u.type)*cover*cost*0.35*(u.hp/100) + stars*30;
      if (t.t==='F' && t.owner===side) pos -= 600;
      const occ = G.units.find(o => o !== u && o.hp > 0 && o.x === x && o.y === y);
      if (occ){
        if (canJoin(u, occ) && u.hp <= 60 && occ.hp <= 70 && (500 + pos) > best.s) best = {s:500 + pos, k, act:'join', o:occ};
        continue;
      }
      if (pos > best.s) best = {s:pos, k, act:'wait'};
      if (U[u.type].cap && TER[t.t].prop && t.owner !== side){
        let v = 2600 + (TER[t.t].hq ? 30000 : 0) + (t.owner === foe ? 1200 : 0) + (TER[t.t].build ? 900 : 0);
        const left = t.cap - Math.floor(disp(u.hp) * capMul(side));
        if (t.capBy === u.id) v += (20 - t.cap)*200;
        if (left <= 0) v += 2500;
        const s = v + pos*0.3;
        if (s > best.s) best = {s, k, act:'cap'};
      }
      const moved = k !== key(u.x,u.y);
      for (const d of targetsFrom(u, x, y, moved, V)){
        const ds = starsAt(d,d.x,d.y);
        const dealt = dmgPct(u, d, u.hp, d.hp, ds, luckAvg);
        const kill = dealt >= d.hp;
        let v = Math.min(dealt, d.hp)/100 * U[d.type].cost + (kill ? U[d.type].cost*0.35 : 0);
        if (tile(d.x,d.y).capBy === d.id) v += 1800;
        let cv = 0;
        if (!kill && mdist(x,y,d.x,d.y)===1 && !U[d.type].ind && base(d.type,u.type)!=null){
          const c = dmgPct(d, u, d.hp - dealt, u.hp, stars, luckAvg);
          cv = Math.min(c, u.hp)/100 * cost;
        }
        const s = 250 + v - cv*0.9 + pos*0.4;
        if (s > best.s) best = {s, k, act:'atk', d};
      }
    }
    const ox = u.x, oy = u.y;
    const {path, trap} = trimPath(u, pathTo(R, best.k));
    ui = {mode:'idle', sel:u}; render();
    await animateMove(u, path);
    const [tx,ty] = path[path.length-1];
    u.x = tx; u.y = ty;
    leaveTile(u, ox, oy);
    if (trap) { /* ambushed: turn over for this unit */ }
    else if (best.act === 'atk' && best.d.hp > 0){ await sleep(150); await showBattle(doAttack(u, best.d)); }
    else if (best.act === 'cap') doCapture(u);
    else if (best.act === 'join' && best.o.hp > 0 && best.o.x === u.x && best.o.y === u.y) doJoin(u, best.o);
    u.acted = true;
    ui = {mode:'idle'}; refresh();
    await sleep(canSee(viewVis(), u) ? 260 : 40);
  }
  if (!G.over) aiBuild(side, foe);
  busy = false; ui = {mode:'idle'};
  save(); refresh();
  if (!G.over){ await sleep(400); endTurn(); }
}
function aiBuild(side, foe){
  const V = G.fog ? visFor(side) : null;
  const mine = G.units.filter(u => u.side === side), theirs = G.units.filter(u => u.side === foe && canSee(V,u));
  let foot = mine.filter(u => U[u.type].cap).length;
  const uncaptured = G.tiles.flat().filter(t => TER[t.t].prop && t.owner !== side).length;
  const pref = G.co[side];
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const t = tile(x,y);
    if (t.t !== 'F' || t.owner !== side || unitAt(x,y)) continue;
    const f = G.funds[side];
    if (f < costOf(side,'rifle')) return;
    let choice = null;
    const footCap = pref === 'sable' ? 8 : 6;
    if (foot < 3 || (uncaptured > 6 && foot < footCap && rng() < .6)){
      const armor = theirs.filter(e => VEH(e.type)).length;
      choice = (f >= costOf(side,'rocket') && armor >= 2 && rng() < .5) ? 'rocket' : 'rifle';
    } else {
      let bestS = -1e9;
      for (const t2 of ORDER){
        const c = costOf(side,t2); if (c > f) continue;
        const probe = {type:t2, side, hp:100};
        let s = c * 0.04;
        for (const e of theirs){
          s += (base(t2, e.type) || 0) * atkOf(probe)/100 * U[e.type].cost / 100 * disp(e.hp)/10;
          s -= (base(e.type, t2) || 0) * atkOf(e)/100 * c / 100 * disp(e.hp)/10 * 0.7;
        }
        if (pref === 'ash' && t2 === 'howitzer') s *= 1.15;
        if (pref === 'bruna' && VEH(t2)) s *= 1.2;
        s = s / Math.pow(c, 0.55) + rng()*3;
        if (s > bestS){ bestS = s; choice = t2; }
      }
    }
    if (!choice) continue;
    G.funds[side] -= costOf(side,choice); stat(side).built++; stat(side).spent += costOf(side,choice);
    const nu = addUnit(choice, side, x, y); nu.acted = true;
    if (U[choice].cap) foot++;
  }
}

// ---------- BOOT ----------
window.addEventListener('resize', resize);
if (load()){
  resize(); refresh(); toast('Game resumed');
  if (isAI(G.turn)) runAI();
} else {
  newGame('ai', settings.luck, settings.fog, {red:'vance', blue:'bruna'}); resize(); openMenu();
}
